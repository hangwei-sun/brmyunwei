name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit

      - name: Restore backend
        run: dotnet restore backend/MonitoringPlatform.Api.csproj

      - name: Test backend
        run: dotnet test backend/tests/MonitoringPlatform.Api.Tests.csproj -c Release

      - name: Verify backend formatting
        run: dotnet format backend/MonitoringPlatform.Api.csproj --verify-no-changes --no-restore

      - name: Build Windows Agent
        run: dotnet build agent/MonitoringPlatform.Agent.csproj -c Release

      - name: Test Windows Agent
        run: dotnet run --project agent/tests/MonitoringPlatform.Agent.SelfTests.csproj -c Release

      - name: Verify Agent formatting
        run: dotnet format agent/MonitoringPlatform.Agent.csproj --verify-no-changes --no-restore

      - name: Test Witness
        run: dotnet test witness/tests/MonitoringPlatform.Witness.Tests.csproj -c Release

      - name: Verify Witness formatting
        run: dotnet format witness/MonitoringPlatform.Witness.csproj --verify-no-changes --no-restore

      - name: Verify PowerShell syntax
        shell: pwsh
        run: |
          ./agent/Test-AgentScripts.ps1
          ./witness/Test-WitnessScripts.ps1
          $errors = @()
          Get-ChildItem ./deployment -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            $errors += $parseErrors
          }
          if ($errors.Count -gt 0) { throw 'Deployment PowerShell syntax verification failed.' }

      - name: Check vulnerable NuGet dependencies
        shell: pwsh
        run: |
          foreach ($project in @('backend/MonitoringPlatform.Api.csproj', 'agent/MonitoringPlatform.Agent.csproj', 'witness/MonitoringPlatform.Witness.csproj')) {
            $json = (dotnet list $project package --vulnerable --include-transitive --format json) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "Vulnerability scan failed: $project" }
            if ($json -match '"vulnerabilities"\s*:') { throw "Vulnerable dependency found: $project" }
          }
